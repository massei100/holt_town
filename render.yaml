services:
  - type: web
    name: holt-town-multiplayer
    runtime: node
    plan: free
    region: singapore
    branch: multiplayer
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production

